<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tannimap hero</title>
<!-- Source of assets/hero.png. Render: msedge --headless --screenshot=hero.png --window-size=1600,900 --force-device-scale-factor=2 hero.html -->
<style>
  :root { --paper:#fbfaf6; --ink:#1d2327; --sub:#5f6a70; --line:#dcd8ce; --ok:#2f8f6b; --short:#d1492e; --muted:#b9b4a8; }
  html, body { margin:0; width:1600px; height:900px; background:var(--paper); overflow:hidden; font-family:"Noto Sans JP","Yu Gothic",sans-serif; }
  .left { position:absolute; left:110px; top:205px; width:700px; }
  .word { font-size:124px; font-weight:900; color:var(--ink); letter-spacing:-0.03em; line-height:1; }
  .word .m { color:var(--ok); }
  .tag { margin-top:46px; font-size:44px; font-weight:900; color:var(--ink); line-height:1.35; }
  .sub { margin-top:24px; font-size:25px; color:var(--sub); line-height:1.6; }
  .card { position:absolute; right:90px; top:170px; width:600px; background:#fff; border:3px solid var(--ink);
          border-radius:18px; padding:30px 34px; box-shadow: 10px 10px 0 var(--line); }
  .card h3 { margin:0 0 18px; font-size:26px; color:var(--sub); font-weight:700; letter-spacing:.04em; }
  .row { display:grid; grid-template-columns: 190px 1fr 100px; align-items:center; gap:16px; margin:14px 0; font-size:26px; color:var(--ink); }
  .bar { height:22px; background:#efece5; border-radius:11px; position:relative; overflow:hidden; }
  .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:11px; background:var(--ok); }
  .bar i.s { background:var(--short); }
  .num { text-align:right; font-weight:700; font-family:"Cascadia Mono",Consolas,monospace; }
  .num.s { color:var(--short); }
  .drop { margin-top:20px; padding-top:18px; border-top:2px dashed var(--line); font-size:21px; color:var(--sub); line-height:1.55; }
  .drop b { color:var(--short); }
  .page { color:var(--ok); font-weight:700; }
</style>
</head>
<body>
  <div class="left">
    <div class="word">tanni<span class="m">map</span></div>
    <div class="tag">自分の便覧で、<br>自分の単位を照らし合わせる。</div>
    <div class="sub">区分ごとの不足と、取ったのに数に入らない単位を<br>便覧のページを添えて。AI が便覧を読みます。</div>
  </div>
  <div class="card">
    <h3>卒業要件 130単位（予定込み）</h3>
    <div class="row"><span>基盤科目</span><div class="bar"><i style="width:100%"></i></div><span class="num">16/16</span></div>
    <div class="row"><span>外国語 200番台</span><div class="bar"><i class="s" style="width:4%"></i></div><span class="num s">0/2</span></div>
    <div class="row"><span>コースコア</span><div class="bar"><i class="s" style="width:70%"></i></div><span class="num s">14/20</span></div>
    <div class="row"><span>セミナー等</span><div class="bar"><i style="width:100%"></i></div><span class="num">6/6</span></div>
    <div class="row"><span>自由科目</span><div class="bar"><i style="width:100%"></i></div><span class="num">20/20</span></div>
    <div class="drop"><b>数に入らない 2単位</b>　自由科目は20単位まで <span class="page">p.1</span><br>
      <b>進級要件</b>　200番台の諸外国語 2単位が必要 <span class="page">p.1</span></div>
  </div>
</body>
</html>
